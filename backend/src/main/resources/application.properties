# Application Name
spring.application.name=travelhub-backend

# Server Port
server.port=8085

# MongoDB Configuration (REMPLACER PAR VOS CREDENTIALS)
spring.data.mongodb.uri=mongodb+srv://USERNAME:PASSWORD@CLUSTER.mongodb.net/travelhub?retryWrites=true&w=majority
spring.data.mongodb.database=travelhub

# JWT Configuration (GÉNÉRER UN NOUVEAU SECRET)
jwt.secret=VOTRE_SECRET_JWT_ICI_MIN_64_CARACTERES
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.travelhub=DEBUG
logging.level.org.springframework.data.mongodb.core=DEBUG

# CORS Configuration
cors.allowed-origins=http://localhost:3000

# Date Format
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Stripe Configuration (REMPLACER PAR VOS CLÉS)
stripe.api.key=sk_test_VOTRE_CLE_STRIPE_ICI
stripe.webhook.secret=whsec_VOTRE_SECRET_STRIPE_ICI

# Amadeus API Configuration (CRÉER UN COMPTE SUR developers.amadeus.com)
amadeus.api.key=VOTRE_CLE_AMADEUS_ICI
amadeus.api.secret=VOTRE_SECRET_AMADEUS_ICI

# Foursquare API (OPTIONNEL - peut être commenté)
# foursquare.api.key=VOTRE_CLE_FOURSQUARE_ICI

# Email Configuration - Gmail (OBLIGATOIRE pour notifications)
# 1. Activer validation 2 étapes sur votre compte Gmail
# 2. Générer un "App Password" sur https://myaccount.google.com/apppasswords
# 3. Copier le mot de passe 16 caractères (sans espaces)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=VOTRE_EMAIL@gmail.com
spring.mail.password=VOTRE_APP_PASSWORD_16_CARACTERES
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Sender Email (nom affiché dans les emails)
email.from=noreply@travelhub.com